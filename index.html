<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Porti-Herrera · Finanzas</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Barra superior + menú -->
  <header class="barra">
    <div class="marca">Porti-Herrera<span>finanzas de la casa</span></div>
    <nav id="menu" aria-label="Menú principal">
      <a href="#inicio" data-vista="inicio">Inicio</a>
      <a href="#hoja" data-vista="hoja">Hoja del mes</a>
      <a href="#movimientos" data-vista="movimientos">Movimientos</a>
      <a href="#ahorros" data-vista="ahorros">Ahorros y deudas</a>
      <a href="#presupuesto" data-vista="presupuesto">Presupuesto</a>
      <a href="#reportes" data-vista="reportes">Reportes</a>
      <a href="#ajustes" data-vista="ajustes">Ajustes</a>
    </nav>
    <button id="nube" data-accion="ir-ajustes" data-fase="local">◌ Solo en este dispositivo</button>
  </header>

  <!-- Contenido de la vista activa -->
  <main id="vista"></main>

  <!-- Botón flotante para registrar -->
  <button id="fab" data-accion="registrar">+ Registrar</button>

  <!-- Ventana modal de formularios -->
  <dialog id="modal">
    <div class="modal-cab"><h2 id="modal-titulo"></h2>
      <button type="button" class="cerrar" data-accion="cerrar-modal" aria-label="Cerrar">×</button></div>
    <div class="modal-cuerpo" id="modal-cuerpo"></div>
  </dialog>

  <div id="aviso" role="status" hidden></div>
  <div id="tip" role="tooltip" hidden></div>

  <!-- Bloques en orden de dependencia -->
  <script src="js/config.js"></script>
  <script src="js/semilla.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/motor.js"></script>
  <script src="js/vistas.js"></script>
  <script src="js/formularios.js"></script>
  <script src="js/exportar.js"></script>
  <script src="js/reportes.js"></script>
  <script src="js/nube.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
